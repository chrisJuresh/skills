<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFK board</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --line:#242932; --ink:#e6e9ef; --dim:#8b93a3;
    --running:#3ddc84; --ready:#4cc9f0; --blocked:#e0554e; --done:#2f9e5f;
    --human:#c77dff; --claimed:#f4b740; --failed:#ff5c5c;
    --rail:#39404c; --mark:#4cc9f0;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono)}
  header{position:sticky;top:0;z-index:5;background:rgba(14,16,19,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em}
  .meta{color:var(--dim);font-size:12px}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--running);
    margin-right:6px;animation:p 2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  main{padding:18px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr))}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .head{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .head b{font-size:13px}
  .slots{color:var(--dim);font-size:11.5px}
  .tree{padding:10px 6px 14px;overflow-x:auto}
  .row{display:flex;align-items:flex-start;gap:8px;padding:3px 12px;white-space:nowrap;border-radius:5px}
  .row:hover{background:#1b1f26}
  .rail{color:var(--rail);white-space:pre;flex:none}
  .dot{flex:none;width:1.1em;text-align:center}
  .mark{flex:none;width:1em;text-align:center;color:var(--mark);opacity:.85}
  .num{flex:none;color:var(--dim)}
  .title{overflow:hidden;text-overflow:ellipsis;max-width:46ch}
  .tag{flex:none;font-size:11px;color:var(--dim);background:#1d2128;border:1px solid var(--line);
    border-radius:20px;padding:0 8px;margin-left:2px}
  .tag.live{color:var(--running);border-color:#1f4d33}
  .tag.warn{color:var(--failed);border-color:#4d1f1f}
  .tag.ctx{display:inline-flex;align-items:center;gap:6px}
  .bar{display:inline-block;width:40px;height:5px;border-radius:3px;background:#2b313b;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--running);border-radius:3px}
  .tag.ctx.warm i{background:var(--claimed)} .tag.ctx.warm{color:var(--claimed);border-color:#4d3f16}
  .tag.ctx.hot i{background:var(--failed)}   .tag.ctx.hot{color:var(--failed);border-color:#4d1f1f}
  .s-running .num,.s-running .title{color:var(--ink)}
  .s-running .dot{color:var(--running)}
  .s-ready .dot{color:var(--ready)} .s-ready .title{color:var(--ink)}
  .s-blocked .dot,.s-blocked .num{color:var(--blocked)}
  .s-blocked .title{color:#b8746f}
  .s-done .dot{color:var(--done)} .s-done .title{color:var(--dim);text-decoration:line-through}
  .s-human .dot{color:var(--human)} .s-human .title{color:#b9a6cf}
  .s-claimed .dot{color:var(--claimed)} .s-claimed .title{color:var(--ink)}
  .s-failed .dot{color:var(--failed)} .s-failed .title{color:#e9a0a0}
  .said{padding:1px 12px 6px calc(12px + 3.3em);color:var(--dim);font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .gate{padding:8px 15px;background:#231d10;border-bottom:1px solid #3d3216;color:var(--claimed);font-size:11.5px}
  .gate .gd{color:#9c8a5e;font-size:11px}
  .loose{border-top:1px solid var(--line);padding:9px 15px;color:var(--dim);font-size:11.5px}
  .legend{padding:0 18px 22px;color:var(--dim);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
  .err{margin:18px;padding:12px 15px;border:1px solid #4d1f1f;background:#1e1416;border-radius:8px;color:#e9a0a0}
</style>
</head>
<body>
<header>
  <h1><span class="pulse"></span>AFK board</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<div id="err"></div>
<main id="main"></main>
<div class="legend">
  <span style="color:var(--running)">● running</span>
  <span style="color:var(--ready)">○ ready</span>
  <span style="color:var(--blocked)">· blocked</span>
  <span style="color:var(--done)">✓ done</span>
  <span style="color:var(--human)">✋ human</span>
  <span style="color:var(--claimed)">◐ claimed elsewhere</span>
  <span style="color:var(--failed)">✗ failed</span>
  <span style="color:var(--mark)">⚙ started by the scheduler</span>
</div>

<script>
const GLYPH={running:'●',ready:'○',blocked:'·',done:'✓',human:'✋',claimed:'◐',failed:'✗','landed?':'?'};

function since(iso){
  const s=Math.round((Date.now()-new Date(iso))/1000);
  if(s>3600) return Math.floor(s/3600)+'h'+String(Math.floor(s%3600/60)).padStart(2,'0')+'m';
  if(s>60) return Math.floor(s/60)+'m';
  return s+'s';
}
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// A node hangs under whichever open ticket blocks it, so the tree reads as
// "when this lands, these are released".
function render(m){
  document.getElementById('meta').textContent =
    new Date(m.at).toLocaleTimeString('en-GB',{hour12:false})
    + ' · nothing new launches at or after ' + m.deadline;

  const main=document.getElementById('main');
  main.innerHTML='';
  for(const [name,repo] of Object.entries(m.repos)){
    const live=repo.nodes.filter(n=>n.status==='running').length;
    const sec=document.createElement('section');
    const rows=[];
    const byNum=new Map(repo.nodes.map(n=>[n.number,n]));
    const drawn=new Set();
    // A ticket hangs under the blocker that is actually still gating it. Nesting it
    // under a closed blocker instead would draw the edge that no longer matters and
    // hide the one you are waiting on.
    const parentOf=(x)=>{
      const onBoard=x.blockedBy.filter(b=>byNum.has(b)&&b!==x.number);
      return onBoard.find(b=>!byNum.get(b).closed && byNum.get(b).status!=='done') ?? onBoard[0] ?? null;
    };
    const kidsOf=(n)=>repo.nodes.filter(x=>parentOf(x)===n);

    function draw(node,rail,last,depth){
      if(drawn.has(node.number))return;
      drawn.add(node.number);
      const tags=[];
      const j=node.job, a=j&&j.activity;
      if(node.status==='running'&&j){
        tags.push('<span class="tag live">'+since(j.startedAt)+'</span>');
        if(a&&a.lastTool) tags.push('<span class="tag">'+esc(a.lastTool)+' ×'+a.toolCount+'</span>');
        // A worker inside a long test run or a build is legitimately quiet for
        // minutes, so this only earns a warning well past that.
        if(a&&a.idleSeconds>420) tags.push('<span class="tag warn">idle '+Math.floor(a.idleSeconds/60)+'m</span>');
      }
      // Context occupancy, for a chat still going and for one that has finished —
      // where it ended up is what tells you whether the ticket was near the ceiling.
      const cx=j&&j.context;
      if(cx){
        const cls = cx.pct>=85?'hot' : cx.pct>=60?'warm' : '';
        const k=(n)=>Math.round(n/1000)+'k';
        tags.push('<span class="tag ctx '+cls+'" title="'+k(cx.used)+' of '+k(cx.window)
          +' tokens in context">'
          +'<span class="bar"><i style="width:'+Math.min(100,cx.pct)+'%"></i></span>'
          +cx.pct+'%</span>');
      }
      if(node.status==='blocked'&&node.openBlockers.length>1)
        tags.push('<span class="tag">also #'+node.openBlockers.filter(b=>b!==undefined).join(', #')+'</span>');
      if(node.status==='failed'&&j) tags.push('<span class="tag warn">resume '+j.sessionId.slice(0,8)+'</span>');
      const branch = depth===0 ? '' : rail + (last?'└─ ':'├─ ');
      rows.push('<div class="row s-'+node.status+'">'
        +'<span class="rail">'+branch+'</span>'
        +'<span class="mark" title="'+(node.scheduled?'started by the scheduler':'')+'">'
          +(node.scheduled?'⚙':'')+'</span>'
        +'<span class="dot">'+(GLYPH[node.status]||'?')+'</span>'
        +'<span class="num">#'+node.number+'</span>'
        +'<span class="title">'+esc(node.title)+'</span>'+tags.join('')+'</div>');
      if(node.status==='running'&&a&&a.lastSaid)
        rows.push('<div class="said">'+esc(a.lastSaid)+'</div>');
      const kids=kidsOf(node.number).filter(k=>!drawn.has(k.number));
      kids.forEach((k,i)=>draw(k, depth===0?'':rail+(last?'   ':'│  '), i===kids.length-1, depth+1));
    }

    // Roots first: anything nothing on the board is gating.
    repo.nodes.filter(n=>parentOf(n)===null).forEach(n=>draw(n,'',true,0));
    repo.nodes.filter(n=>!drawn.has(n.number)).forEach(n=>draw(n,'',true,0));

    const loose=repo.looseSessions.filter(s=>s.idleSeconds<900);
    // A held gate is why a slot sits empty with ready work on the board — say so,
    // otherwise it reads as the scheduler having stalled.
    const g=repo.gate;
    const gateBar = g && !g.open
      ? '<div class="gate">⏸ holding new work — '+esc(g.why||'compute busy')
        +(g.detail&&g.detail.length?'<br><span class="gd">'+g.detail.map(esc).join('<br>')+'</span>':'')+'</div>'
      : '';
    sec.innerHTML='<div class="head"><b>'+name+'</b>'
      +'<span class="slots">'+repo.slug+' · '+live+'/'+repo.concurrency+' slots busy</span></div>'
      +gateBar
      +'<div class="tree">'+rows.join('')+'</div>'
      +(loose.length?'<div class="loose">'+loose.map(s=>'~ unscheduled chat '+s.sessionId.slice(0,8)
        +(s.issue?' on #'+s.issue:'')+' · moved '+s.idleSeconds+'s ago').join('<br>')+'</div>':'');
    main.appendChild(sec);
  }
}

// One request at a time. A slow rebuild must not queue polls behind it.
let polling=false;
async function poll(){
  if(polling)return; polling=true;
  const e=document.getElementById('err');
  try{
    const r=await fetch('/api',{cache:'no-store'});
    const m=await r.json();
    if(m.error) throw new Error(m.error);
    e.innerHTML=''; render(m);
  }catch(err){
    e.innerHTML='<div class="err">'+esc(err.message)+' — retrying</div>';
  }finally{ polling=false; }
}
poll(); setInterval(poll,4000);
</script>
</body>
</html>
